<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Campus Notice Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📢 Campus Notice Board</h1>
    </header>

    <main>
        <section class="post-form auth-box">
            <h2 id="auth-title">Login</h2>
            <form id="auth-form">
                <input type="text" id="name" placeholder="Full Name" style="display:none">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="auth-submit">Login</button>
            </form>
            <p id="auth-message" class="auth-message"></p>
            <p><a href="#" id="toggle-link">New student? Register here</a></p>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
