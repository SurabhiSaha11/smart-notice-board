<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Notice Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📢 Campus Notice Board</h1>
        <div class="user-bar">
            <span id="user-info"></span>
            <button id="logout-btn">Logout</button>
        </div>
    </header>

    <main>
        <section class="post-form" id="post-section" style="display:none">
            <h2>Post a New Notice</h2>
            <form id="notice-form">
                <input type="text" id="title" placeholder="Notice Title" required>
                <textarea id="description" placeholder="Notice Description" required></textarea>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="exam">Exam</option>
                    <option value="event">Event</option>
                    <option value="holiday">Holiday</option>
                    <option value="general">General</option>
                </select>
                <label for="expiry">Expiry date (optional):</label>
                <input type="date" id="expiry">

                <label for="attachment">Attachment (optional, PDF/PNG/JPG, max 5 MB):</label>
                <input type="file" id="attachment" accept=".pdf,.png,.jpg,.jpeg">
                
                <button type="submit">Post Notice</button>
            </form>
        </section>

        <div class="filter-bar">
            <button class="filter-btn active" data-category="">All</button>
            <button class="filter-btn" data-category="exam">Exam</button>
            <button class="filter-btn" data-category="event">Event</button>
            <button class="filter-btn" data-category="holiday">Holiday</button>
            <button class="filter-btn" data-category="general">General</button>
        </div>

        <div id="notice-list"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
